[tool.poetry]
name = "gpt-assistants-api-ui"
version = "0.1.0"
description = "A Streamlit application integrating OpenAI and various tools"
authors = ["ryo-ma <saka_ro@yahoo.co.jp>, <tom@bcclive.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10 || ^3.11"
streamlit = "^1.28.2"
openai = "^1.3.2"
pillow = "^9.0.1"
pytesseract = "^0.3.8"
opencv-python-headless = "^4.5.5.62"
pydub = "^0.25.1"
streamlit-authenticator = "^0.3.2"
python-dotenv = "^1.0.1"
black = "^23.12.1"
gtts = "^2.2.3"

[tool.poetry.group.develop.dependencies]
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"